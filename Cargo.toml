[package]
name = "mire"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Test-pattern generator for model endpoints: a known signal in, a look at what comes out"
authors = ["Guillaume Leroy <gleroy@therealm.tech>"]
repository = "https://github.com/therealm-tech/mire"
license = "Apache-2.0"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
aide = { version = "0.15.1", features = ["axum", "axum-json", "axum-multipart", "axum-query", "scalar", "macros"] }
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-core = "0.3.34"
jsonschema = { version = "0.49.9", default-features = false }
minijinja = { version = "2.23.0", features = ["json"] }
notify = "8.2.0"
rand = "0.10.2"
# Already in the tree under `tracing-subscriber`; direct because `tools:` on a
# hook is a regex.
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset", "http2", "stream", "gzip", "system-proxy", "form", "multipart"] }
rhai = { version = "1.25.1", features = ["sync", "serde"] }
rust-embed = "8.12.0"
schemars = { version = "0.9", features = ["url2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json_path = "0.7.2"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync"] }
tower-http = { version = "0.7.0", features = ["trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
base64 = "0.23.1"
insta = { version = "1.48.0", features = ["json", "yaml"] }
notify = "8.2.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
