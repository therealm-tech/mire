---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # A lockfile is legitimately large and legitimately versioned.
        exclude: ^ui/package-lock\.json$
      - id: check-merge-conflict
      - id: detect-private-key

  # The repository is Rust, but `dev/mcp/` is a real Python program that `mire`
  # is tested against — and it already carries `# noqa:` codes, which only mean
  # anything if something enforces them. Upstream hook rather than a `system`
  # entry: pre-commit builds its own isolated environment, so there is nothing
  # to install by hand.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Linters and static analysis only. The test suites — `cargo test` and
  # `vitest` — deliberately do not run here: a commit hook has to stay fast
  # enough that nobody reaches for `--no-verify`, and a suite that grows past a
  # few seconds is the thing that makes them. Both run in the `quality`
  # workflow, on every push and every pull request.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types:
          - rust
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types:
          - rust
        pass_filenames: false

      - id: hadolint
        name: hadolint
        entry: hadolint
        language: system
        files: ^Dockerfile$

      # Catches the container-security misconfigurations hadolint does not: root
      # user, writable filesystem, secrets in build args.
      #
      # Every severity. What is waived is waived in `.trivyignore.yaml`, in one
      # place, with the reasoning attached — `--ignorefile` is explicit because
      # trivy does not pick the file up on its own.
      - id: trivy-config
        name: trivy config
        entry: trivy config --exit-code 1 --ignorefile .trivyignore.yaml
        language: system
        files: ^Dockerfile$

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types:
          - shell

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      # Run from `ui/`, like the hook below, because that is where the
      # Biome configuration lives. Invoked from the repository root instead,
      # Biome 2 sees `ui/biome.json` as a nested root project and refuses to
      # start — the front end is a subproject of a Rust repository, not a
      # workspace member.
      - id: biome
        name: biome check
        entry: npm --prefix ui run lint
        language: system
        files: ^ui/.*\.(ts|tsx|json)$
        pass_filenames: false

      # A blocking gate, on the same footing as the linter.
      - id: ui-typecheck
        name: tsc --noEmit
        entry: npm --prefix ui run typecheck
        language: system
        files: ^ui/.*\.(ts|tsx|json)$
        pass_filenames: false
