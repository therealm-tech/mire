# Ollama's native embedding endpoint.
#
# The vectors arrive under `$.embeddings` as a list of lists, not under
# `$.data[*].embedding` — so the OpenAI shape is kept first in the cascade
# precisely to watch it miss and the second one win. Point this same model at
# `/v1/embeddings` instead and the first one takes over, unchanged.
#
# No `auth:`: this one goes straight at Ollama, so it calls as `anonymous` —
# which is what makes the auth panel read differently here than on `qwen3`.
---
name: nomic
kind: embedding
url: http://127.0.0.1:11434/api/embed
timeout_ms: 60000

request:
  template: |
    {
      "model": "nomic-embed-text:v1.5",
      "input": {{ input | tojson }}
    }

# Two shapes, named rather than spelled out. `openai-embeddings` puts one object
# per input under `data`; `ollama-native-embeddings` reads the bare list of lists.
# Both are compiled into `mire` — nothing to install, and a `decodes/` file of
# your own displaces either one by name.
#
# The second one also brings the error path, and it is worth knowing where it
# points: Ollama's whole complaint is a string — `{"error": "model 'nomic' not
# found, try pulling it first"}` — and a string is a message, so nothing more is
# needed. Asking a chat model to embed lands exactly there, which is the mistake
# this turns into a sentence instead of an empty vector list.
decode:
  from:
    - openai-embeddings
    - ollama-native-embeddings
