# The one that reproduces what a pod actually does: the projected service account
# token is presented as an RFC 7523 client assertion, and re-read from disk on
# every exchange so rotation is a non-event.
#
# Add `token_endpoint:` to skip discovery when an IdP's well-known document is
# wrong or unreachable.

# ---
# name: oidc-workload
# kind: oidc
# issuer: https://idp.internal/realms/models
# client_id: mire
# client_assertion:
#   file: /var/run/secrets/kubernetes.io/serviceaccount/token
# audience: https://models.internal
