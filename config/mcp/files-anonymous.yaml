# Nothing at all — not an omission, a test. The question is "is this server
# actually protected?", and the answer you want is a 401. Servers are anonymous
# by default, so naming it is how you say you meant it.
#
# This file and the other `files-*.yaml` beside it are the same URL declared
# under different names, one per way of authenticating. Point a model at each in
# turn: anonymous should fail, the workload identity should pass, and you should
# be able to say which one your service actually uses.
#
# Two placements exist, and they are orthogonal to the kind of credential:
#
#   auth: <provider>           the provider decides where its credential goes,
#                              and a 401 refreshes it and replays once
#   {{ auth["<provider>"] }}   you decide, in any header, anywhere in the value
#
# Prefer `auth:` — it is one word and the replay is free. Reach for the template
# when the *placement* is the problem, not the credential. The provider names are
# the ones in `../auth/`; no credential is ever written here.

# ---
# name: files-anonymous
# url: https://mcp.internal/mcp
# auth: anonymous
