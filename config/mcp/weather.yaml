# The MCP server in docker-compose.yaml. Three tools, each showing one thing:
#
#   get_weather  the ordinary case — and it carries an `x-mcp-header`
#                annotation, so watch `Units` appear as `Mcp-Param-Units`
#   slow_echo    answers as an SSE stream, progress first
#   explode      always answers `isError: true`, which is a *result* the model
#                is meant to react to rather than a failure of the run
#
# None of those three is named below, and that is the point: a run asks the
# server what it has, with `tools/list`, and offers the model whatever comes
# back. A schema change on the server shows up here without this file being
# touched — which is the whole difference between checking that a model emits
# well-formed calls and checking that tool calling works.
#
# Every server declared in this directory is offered to every `kind: chat` model.
# This is the one place in `mire` where a run has effects outside the process: a
# tool the model calls here is really executed, on a real server. Which is why
# declaring a server *is* the opt-in — a model has no say. Untick one in the
# composer's Servers row, or send `mcpServers:` on the request, to leave it out
# of a single run.
#
# `mire` speaks three revisions of the Streamable HTTP transport — 2026-07-28
# (no handshake, no session, mirrored headers), 2025-06-18 and 2025-03-26 (an
# `initialize` handshake and a session header). It settles on one per server, on
# first use, and `GET /api/mcp/<id>/tools` reports which one and how it was
# decided. Everything goes through the same HTTP client as the model endpoints,
# so `--ca-bundle` and the auth registry apply here exactly as they do there.
#
# `tools:` would restrict what the model may reach, and there is one fact worth
# knowing before you decide you do not need it: qwen3:0.6b calls a tool reliably
# when it is offered one, and starts answering from memory when it is offered
# three. That is a fact about a 523 MB model, not about MCP — and offering it all
# three, as this file does, is how you watch it happen. Add the two lines back
# and watch it stop.
#
# The two files beside it are this same server asked two other questions, and
# neither narrows the tool list either:
#
#   weather-staged.yaml  one file, two declarations of the same endpoint — one
#                        negotiating the revision, one pinned to it
#   weather-hooks.yaml   what fires around a tool call, and what a call leaves
#                        behind for the next one
#
# All three are live, which means a chat run sets up all of them and the model is
# offered `get_weather` more than once. That is a lot to hand a small model —
# the Servers row is where you cut it down to the one you are asking about.
---
name: weather
url: http://127.0.0.1:11436/mcp
timeout_ms: 15000
auth: keycloak-user
