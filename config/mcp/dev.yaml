# The MCP server in docker-compose.yaml. Three tools, each showing one thing:
#
#   get_weather  the ordinary case — and it carries an `x-mcp-header`
#                annotation, so watch `Units` appear as `Mcp-Param-Units`
#   slow_echo    answers as an SSE stream, progress first
#   explode      always answers `isError: true`, which is a *result* the model
#                is meant to react to rather than a failure of the run
#
# Every server declared in this directory is offered to every `kind: chat` model.
# This is the one place in `mire` where a run has effects outside the process: a
# tool the model calls here is really executed, on a real server. Which is why
# declaring a server *is* the opt-in — a model has no say. Untick one in the
# composer's Servers row, or send `mcpServers:` on the request, to leave it out
# of a single run.
#
# `mire` speaks three revisions of the Streamable HTTP transport — 2026-07-28
# (no handshake, no session, mirrored headers), 2025-06-18 and 2025-03-26 (an
# `initialize` handshake and a session header). It settles on one per server, on
# first use, and `GET /api/mcp/<name>/tools` reports which one and how it was
# decided. Everything goes through the same HTTP client as the model endpoints,
# so `--ca-bundle` and the auth registry apply here exactly as they do there.
#
# `tools:` restricts what the model may reach. Leaving it out — the default —
# offers whatever the server advertises, which is what you want when you point
# `mire` at a server you meant to point it at.
#
# It is narrowed here for a reason worth knowing: qwen3:0.6b calls a tool
# reliably when it is offered one, and starts answering from memory when it is
# offered three. That is a fact about a 523 MB model, not about MCP — delete the
# two lines below and watch it happen. `/api/mcp/dev/tools` always lists
# everything the server advertises, restriction or not.
---
name: dev
url: http://127.0.0.1:11436/mcp
timeout_ms: 15000
auth: keycloak-user
tools:
  - get_weather

# What to keep out of a tool's result, for a hook or a header to address itself
# with later. Each rule names the tools it applies to — anchored regexes, like a
# hook's `tools:`, empty being every tool — and a JSONPath cascade per variable,
# tried in order like a `decode:` field.
#
# It belongs here, on the server, rather than on a model: a rule is a statement
# about a **tool**, and a tool does not belong to a model. `create_session`
# answers a session id at `$.sessionId` whether the model that called it is qwen3
# or the one you are comparing it against — so writing the rule into each model
# meant two files that had to be kept identical by hand, which is exactly the
# shape of thing that quietly stops being identical. Written once here, every
# chat model gets it.
#
# The paths compile when this file loads, and every tool card in the trace says
# what it set. They are then read as `vars` by a hook's `url:`, `json:` and
# `headers:`, and by a server's own `headers:`.
#
# A rule that covers a tool and captures nothing from it warns, naming the paths
# it tried: the rule has said that tool produces that variable, and the
# alternative is finding out three turns later from a rendered URL. Which is also
# why `tools:` is worth naming — an empty one covers every tool, so it warns on
# every call that does not carry the variable.
#
# `dev` opens no session, so this is here as the shape to copy. A model's
# simulated `tools:` capture nothing at all, whatever they answer: they run
# in-process and belong to no server.
#
# capture:
#   - tools:
#       - create_session
#     vars:
#       session:
#         - $.sessionId
#         - $.session.id
#   - tools:
#       - get_weather
#     vars:
#       temp:
#         - $.temp
