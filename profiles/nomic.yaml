# Ollama's native embedding endpoint.
#
# The vectors arrive under `$.embeddings` as a list of lists, not under
# `$.data[*].embedding` — so the OpenAI path is kept first in the cascade
# precisely to watch it miss and the second one win. Point this same profile at
# `/v1/embeddings` instead and the first path takes over, unchanged.
#
# No `auth:`: this one goes straight at Ollama, so it calls as `anonymous` —
# which is what makes the auth panel read differently here than on `qwen3`.
#
# nomic-embed-text:v1.5 returns 768 dimensions, and `expect.dimensions` is what
# turns that into a check rather than a number you have to eyeball.
---
name: nomic
kind: embedding
url: http://127.0.0.1:11434/api/embed
timeout_ms: 60000

request:
  template: |
    {
      "model": "nomic-embed-text:v1.5",
      "input": {{ input | tojson }}
    }

decode:
  vectors:
    - $.data[*].embedding
    - $.embeddings
  usage:
    - $.usage
    - $
  # Ollama's whole error is a string — `{"error": "model 'nomic' not found, try
  # pulling it first"}` — and a string is a message, so nothing more is needed
  # here. Asking a chat model to embed lands exactly here, which is the mistake
  # this line turns into a sentence instead of an empty vector list.
  error:
    - $.error

expect:
  dimensions: 768
