# Ollama's own chat API — the "endpoint that does not answer like OpenAI" you
# can actually run.
#
# The content is at `$.message.content`, the stop reason is called `done_reason`,
# and the token counters sit at the top level instead of under `usage`. The
# decode block is byte-for-byte the same as qwen3-chat.yaml: the cascades absorb
# the difference, and the decode trace shows which path matched.
#
# `"stream": {{ stream | tojson }}` is driven by the call rather than hard-coded:
# Send asks for one JSON object, Stream asks for NDJSON — one object per token,
# no `data:` prefix and no sentinel — and `decode.delta` reads both. The
# `| tojson` matters: MiniJinja renders a bare boolean as `True`, which is not
# JSON.
# `think: false` keeps qwen3's reasoning out of the content.
---
name: qwen3-native
kind: chat
url: http://127.0.0.1:11434/api/chat
timeout_ms: 120000

request:
  template: |
    {
      "model": "qwen3:0.6b-q4_K_M",
      "messages": {{ messages | tojson }},
      {% if tools %}"tools": {{ tools | tojson }},{% endif %}
      "stream": {{ stream | tojson }},
      "think": false,
      "options": {
        "num_predict": {{ params.max_tokens | default(256) }}
      }
    }

decode:
  content:
    - $.choices[0].message.content
    - $.message.content
  # Byte-for-byte the same as qwen3-chat.yaml, streaming included.
  delta:
    - $.choices[0].delta.content
    - $.message.content
  tool_calls:
    - $.choices[0].message.tool_calls
    - $.message.tool_calls
  finish_reason:
    - $.choices[0].finish_reason
    - $.done_reason
  usage:
    - $.usage
    - $

# Agent mode runs this profile in a loop. The defaults are what you want almost
# always: stop as soon as the model asks for no more tools, ten turns at most.
#
# Setting `no_tool_calls: false` and relying on `finish_reason_in` alone against
# an endpoint that never reports one is the case `mire` refuses to let pass
# quietly: it stops and says the predicate could never be evaluated, rather than
# looking like a slow agent.
# No `finish_reason_in` here, and that omission is the interesting part.
#
# This endpoint reports `done_reason: "stop"` on a turn that is still asking for
# a tool — measured, not assumed. Adding `stop` to the list would end the loop at
# turn 1, before the tool is ever answered, and it would look like the model
# refused to use its tools. `qwen3-chat.yaml` can afford the predicate because
# the OpenAI-compatible endpoint says `tool_calls` on exactly those turns.
#
# Same model, same weights, two different answers to "are you finished?". That
# divergence is the sort of thing this tool exists to make visible.
agent:
  stop_when:
    no_tool_calls: true
  max_iterations: 6
  max_duration_ms: 600000

# Simulated: nothing is executed. What is checked is that the model emits calls
# matching this schema and knows what to do with a result. Swap `response` for a
# `script` to have the answer depend on the arguments.
tools:
  - name: get_weather
    schema:
      type: object
      properties:
        city:
          type: string
      required:
        - city
    response: '{"temp": 21, "conditions": "clear"}'
