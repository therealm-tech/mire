# The chat profile, behind the gateway that requires a credential.
#
# One file, carrying everything `mire` does with a chat endpoint: a request
# template driven by the call, a decode cascade covering two response shapes, an
# agent loop, real MCP tools, and an `auth:` that makes the identity a question
# with an answer.
#
# The URL is the gateway rather than Ollama itself, which is what makes that
# question worth asking. Change the one line below — or override it per call with
# `POST /api/call -d '{"profile": "qwen3", "auth": "..."}'` — and you get the
# matrix this tool exists for:
#
#   anonymous          -> 401, and that is a pass: the route is protected
#   static-token       -> 200
#   keycloak-workload  -> 200, with a token really fetched from Keycloak
#   keycloak-user      -> 200, as you, after signing in
#
# One profile, four answers, nothing duplicated. Point `url:` at
# http://127.0.0.1:11434/v1/chat/completions and delete `auth:` to talk to Ollama
# with nothing in the way.
---
name: qwen3
kind: chat
url: http://127.0.0.1:11435/v1/chat/completions
auth: keycloak-workload
# Agent turns add up, and a cold model loads on the first call.
timeout_ms: 300000

# `"stream": {{ stream | tojson }}` is what makes the composer's `stream` box do
# anything: the flag comes from the call, so one profile serves both shapes — in
# either mode, a single turn or the whole loop. The `| tojson` is not decoration
# — MiniJinja renders a bare boolean as `True`, which is Python and is not JSON.
#
# Ticking it for a loop is worth one caveat: a streamed answer is decoded from
# its last chunk, and this endpoint splits a tool call's arguments across several
# — so a streamed run of the agent below stops at turn one with `noToolCalls`
# rather than calling `get_weather`. Which is a real answer about this endpoint,
# and the reason the box starts unticked.
#
# `reasoning_effort: "none"` is what turns qwen3's thinking off on Ollama's
# OpenAI-compatible endpoint. Without it the model spends its whole budget
# reasoning and `content` comes back empty with `finish_reason: length` — which
# is a genuinely confusing first result. (`chat_template_kwargs` is the vLLM
# spelling; Ollama ignores it.)
request:
  template: |
    {
      "model": "qwen3:0.6b-q4_K_M",
      "messages": {{ messages | tojson }},
      {% if tools %}"tools": {{ tools | tojson }},{% endif %}
      "stream": {{ stream | tojson }},
      "reasoning_effort": "none",
      "max_tokens": {{ params.max_tokens | default(256) }},
      "messages": [
        {% for file in uploads %}{% if file.text %}
        {"role": "user", "content": {{ ("Contents of " ~ file.name ~ ":\n" ~ file.text) | tojson }}},
        {% endif %}{% endfor %}
        {% for message in messages %}{{ message | tojson }}{% if not loop.last %},{% endif %}{% endfor %}
      ]
    }

# Attachments are an ingredient, and this is the recipe — nothing arrives on the
# wire because a file was attached, only because a template said so. `uploads`
# holds what the call named, each entry carrying the file whole: `text` when it
# decodes as UTF-8, `base64` and `dataUrl` always.
#
# Inlining a log or a CSV into the question works against this stack, since
# qwen3:0.6b reads text. Replace `messages` above with:
#
#     "messages": [
#       {% for file in uploads %}{% if file.text %}
#       {"role": "user", "content": {{ ("Contents of " ~ file.name ~ ":\n" ~ file.text) | tojson }}},
#       {% endif %}{% endfor %}
#       {% for message in messages %}{{ message | tojson }}{% if not loop.last %},{% endif %}{% endfor %}
#     ],
#
# Showing one a *picture* needs a model that can see, which this one cannot —
# point `url:` at a vision endpoint and the shape is `file.dataUrl` in an
# `image_url` content part. The README has that one in full.

# Every field is a cascade, and the second path in each is where Ollama's *own*
# API puts the same thing: content at `$.message.content`, the stop reason called
# `done_reason`, the token counters at the top level instead of under `usage`.
#
# Nothing here has to change to follow it. Point `url:` at
# http://127.0.0.1:11434/api/chat, drop `auth:`, swap `reasoning_effort` for
# `"think": false`, and the second path of each cascade takes over — the decode
# trace names the one that won, which is how you find out rather than assume.
decode:
  content:
    - $.choices[0].message.content
    - $.message.content
  # Where the text sits inside one chunk of a stream, which is not where it sits
  # in a whole response: OpenAI moves it from `message` to `delta`, and Ollama's
  # native API keeps `message` but sends one object per line. Both are here, so
  # this one block covers both endpoints streamed and unstreamed.
  delta:
    - $.choices[0].delta.content
    - $.message.content
  tool_calls:
    - $.choices[0].message.tool_calls
    - $.message.tool_calls
  finish_reason:
    - $.choices[0].finish_reason
    - $.done_reason
  # Streamed, this one comes up empty on the OpenAI-compatible endpoint: token
  # counts are only sent if the request asks for them
  # (`"stream_options": {"include_usage": true}`). `$` still matches — it matches
  # anything — so the trace says `usage` was resolved while every field is null.
  # That is the cascade being honest about what it found, not a decode bug.
  usage:
    - $.usage
    - $
  # The one field that is not about the answer: what the endpoint says when there
  # is no answer. Three shapes reach this profile, and `$` covers all three
  # because the node is read wherever the complaint sits inside it:
  #
  #   {"error": {"message": "…", "type": "…", "code": "…"}}   the OpenAI-compatible endpoint
  #   {"error": "model 'qwen3:0.6b' not found"}               Ollama's own API
  #   {"error": "invalid_token", "error_description": "…"}    the gateway, when the credential is the problem
  #
  # `$.error` would look like the obvious path and is the wrong one for the third:
  # OAuth2 puts the *code* in `error` and the sentence in `error_description`, so
  # pointing one level down hands back `invalid_token` and drops the only line
  # that explains it.
  #
  # The status is never consulted. An endpoint answering 200 with a complaint in
  # the body is precisely the mismatch worth catching, and a 400 with nothing in
  # it leaves this empty rather than inventing a sentence.
  error:
    - $

# Agent mode runs this profile in a loop. Stop as soon as the model asks for no
# more tools, or says it is done.
#
# `finish_reason_in` is affordable here because the OpenAI-compatible endpoint
# reports `tool_calls` on exactly the turns that are still asking for one.
# Ollama's own `/api/chat` says `done_reason: "stop"` on those same turns —
# measured, not assumed — so following the note above and keeping this list would
# end the loop at turn 1 and look like a model refusing to use its tools. Same
# model, same weights, two different answers to "are you finished?": that
# divergence is the sort of thing this tool exists to make visible.
#
# Setting `no_tool_calls: false` and relying on `finish_reason_in` alone against
# an endpoint that never reports one is the case `mire` refuses to let pass
# quietly: it stops and says the predicate could never be evaluated, rather than
# looking like a slow agent.
agent:
  stop_when:
    no_tool_calls: true
    finish_reason_in:
      - stop
      - end_turn
  max_iterations: 6
  max_duration_ms: 600000

# The tools are not declared here, and neither are the servers they come from.
# Every server mcp.yaml declares is offered to every `kind: chat` profile: they
# are fetched at the start of the run and **really called**, which is the
# difference between checking that the model emits well-formed calls and checking
# that tool calling works. The declarations the model sees come from each server's
# own `tools/list`, so a schema change there shows up here without touching this
# file. The Servers row in the composer is where a single run leaves one out.

# A simulated tool of the same name would win over the server's, which is how you
# stub exactly one tool of an otherwise live server — and how you check that the
# model emits well-formed calls with nothing running at all:
#
# tools:
#   - name: get_weather
#     schema:
#       type: object
#       properties:
#         city:
#           type: string
#       required:
#         - city
#     response: '{"temp": 21, "conditions": "clear"}'
#
# Swap `response` for a `script` to have the answer depend on the arguments.
