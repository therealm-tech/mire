# MCP servers. Every one declared here is offered to every `kind: chat` profile.
#
# This is the one place in `mire` where a run has effects outside the process: a
# tool the model calls here is really executed, on a real server. Which is why
# declaring a server *is* the opt-in — this file is the whole of it, and a
# profile has no say. Untick one in the composer's Servers row, or send
# `mcpServers:` on the request, to leave it out of a single run.
#
# `mire` speaks three revisions of the Streamable HTTP transport — 2026-07-28
# (no handshake, no session, mirrored headers), 2025-06-18 and 2025-03-26 (an
# `initialize` handshake and a session header). It settles on one per server, on
# first use, and `GET /api/mcp/<name>/tools` reports which one and how it was
# decided. Everything goes through the same HTTP client as the model endpoints,
# so `--ca-bundle` and the auth registry apply here exactly as they do there.
---
servers:
  # The server in docker-compose.yaml. Three tools, each showing one thing:
  #
  #   get_weather  the ordinary case — and it carries an `x-mcp-header`
  #                annotation, so watch `Units` appear as `Mcp-Param-Units`
  #   slow_echo    answers as an SSE stream, progress first
  #   explode      always answers `isError: true`, which is a *result* the model
  #                is meant to react to rather than a failure of the run
  # `tools:` restricts what the model may reach. Leaving it out — the default —
  # offers whatever the server advertises, which is what you want when you point
  # `mire` at a server you meant to point it at.
  #
  # It is narrowed here for a reason worth knowing: qwen3:0.6b calls a tool
  # reliably when it is offered one, and starts answering from memory when it is
  # offered three. That is a fact about a 523 MB model, not about MCP — delete
  # the two lines below and watch it happen. `/api/mcp/dev/tools` always lists
  # everything the server advertises, restriction or not.
  - name: dev
    url: http://127.0.0.1:11436/mcp
    timeout_ms: 15000
    auth: keycloak-user
    tools:
      - get_weather

  # `protocol_version:` skips the negotiation and states the revision outright.
  # Reach for it when the version is the thing under test rather than a detail:
  # pinning one the server refuses gets you the refusal, which is the answer you
  # were looking for. Declare the same URL under several pins and you can say
  # exactly which revisions your endpoint accepts. For a one-off, the UI's
  # Protocol dropdown asks the same question for a single run without touching
  # this file; a pin here is the one you want to keep.
  #
  # - name: dev-on-the-old-one
  #   url: http://127.0.0.1:11437/mcp
  #   protocol_version: 2025-06-18

  # ---------------------------------------------------------------------------
  # Every auth workflow, commented out. Delete what you do not need.
  #
  # Two placements, and they are orthogonal to the kind of credential:
  #
  #   auth: <provider>           the provider decides where its credential goes,
  #                              and a 401 refreshes it and replays once
  #   {{ auth["<provider>"] }}   you decide, in any header, anywhere in the value
  #
  # Every kind below works with either. Prefer `auth:` — it is one word and the
  # replay is free. Reach for the template when the *placement* is the problem,
  # not the credential.
  #
  # The provider names are the ones in auth.yaml. Everything here is a name
  # pointing at that file; no credential is ever written in this one.
  # ---------------------------------------------------------------------------

  # --- 1. Nothing at all -----------------------------------------------------
  #
  # Not an omission — a test. The question is "is this server actually
  # protected?", and the answer you want is a 401. Servers are anonymous by
  # default, so naming it is how you say you meant it.
  #
  # - name: files-anonymous
  #   url: https://mcp.internal/mcp
  #   auth: anonymous

  # --- 2. A static token from the environment --------------------------------
  #
  # The quickest thing that gets you past a door. `static-token` reads
  # MODEL_TOKEN; the value never appears in this file, in a log, or in any API
  # response.
  #
  # - name: files-token
  #   url: https://mcp.internal/mcp
  #   auth: static-token

  # --- 3. A projected service account token ----------------------------------
  #
  # What a pod actually holds. Declare `workload-token` in auth.yaml (it is
  # already there, commented) pointing at
  # /var/run/secrets/kubernetes.io/serviceaccount/token: the file is re-read on
  # every call, so rotation is a non-event and nothing has to restart.
  #
  # - name: files-sa
  #   url: https://mcp.internal/mcp
  #   auth: workload-token

  # --- 4. A workload identity ------------------------------------------------
  #
  # A real client_credentials exchange: `mire` discovers the token endpoint,
  # fetches an access token, caches it and renews it before it expires. This
  # answers "what does the pod get?".
  #
  # - name: files-workload
  #   url: https://mcp.internal/mcp
  #   auth: keycloak-workload

  # --- 5. You, through your browser ------------------------------------------
  #
  # The other half of that question: "what do *I* get?". Sign in from the auth
  # panel first — until there is a session, a call to this server answers
  # `409 not_signed_in` and **nothing is sent**, rather than going out
  # half-authenticated and coming back with a confusing 401.
  #
  # - name: files-as-me
  #   url: https://mcp.internal/mcp
  #   auth: keycloak-user

  # --- 6. The same credentials, placed by hand -------------------------------
  #
  # For the server that wants the token somewhere `auth:` would never put it.
  # `auth` is the registry itself, keyed by provider name, each entry the bare
  # token that provider would produce — so everything above is available here,
  # including inside a larger value.
  #
  # Write the bracket form: `auth.keycloak-workload` parses as a subtraction.
  #
  # - name: files-api-key
  #   url: https://mcp.internal/mcp
  #   headers:
  #     x-api-key: '{{ auth["keycloak-workload"] }}'
  #
  # - name: files-custom-scheme
  #   url: https://mcp.internal/mcp
  #   headers:
  #     authorization: 'Custom tenant=acme token={{ auth["keycloak-user"] }}'

  # --- 7. No registry at all -------------------------------------------------
  #
  # A value straight from the process environment, for a key that is not really
  # an identity. `env` is read fresh on every request, like everything else here.
  #
  # An undefined variable is an **error**, not an empty header: `Authorization:
  # Bearer ` is the kind of thing that looks fine locally and fails somewhere
  # unhelpful. Use `| default(...)` where a header really is optional.
  #
  # - name: files-key
  #   url: https://mcp.internal/mcp
  #   headers:
  #     x-api-key: "{{ env.FILES_API_KEY }}"
  #     x-tenant: "{{ env.TENANT | default('dev') }}"

  # --- 7b. A session an earlier tool call opened -----------------------------
  #
  # `vars` is what this run's tool calls have captured, per the profile's
  # `agent.capture:` — see captures.yaml. This is how a tool that opens a session
  # puts that session on every later request to the same server.
  #
  # The `| default('')` is **not** decoration here. These headers render on
  # every request, and the first is the `tools/list` at setup — before any tool
  # has been called, so before anything has been captured. Without it, the run
  # dies negotiating. A hook's headers need no such thing: a hook only fires
  # around a call.
  #
  # - name: files-session
  #   url: https://mcp.internal/mcp
  #   headers:
  #     x-session: "{{ vars.session | default('') }}"

  # --- 8. Both at once -------------------------------------------------------
  #
  # Templated headers are applied first and the `auth:` provider last, so on a
  # name collision the named provider wins — it is the more specific statement,
  # and it should not be silently overwritten by a hand-written header.
  #
  # Only the providers actually named get resolved. Asking for a token costs an
  # exchange and can fail, and neither belongs to a server that never asked.
  #
  # - name: files
  #   url: https://mcp.internal/mcp
  #   auth: keycloak-workload
  #   headers:
  #     x-tenant: "{{ env.TENANT | default('dev') }}"
  #   tools:
  #     - read_file
  #     - list_directory

  # --- The move this is all for ----------------------------------------------
  #
  # Declare the same URL several times under different names and point a profile
  # at each in turn. Anonymous should fail, the workload identity should pass,
  # and you should be able to say which one your service actually uses.
  #
  # - name: files-anonymous
  #   url: https://mcp.internal/mcp
  #   auth: anonymous
  # - name: files-workload
  #   url: https://mcp.internal/mcp
  #   auth: keycloak-workload

  # ---------------------------------------------------------------------------
  # Hooks: something that happens around a tool call.
  #
  # Calling a live tool is the one thing `mire` does with effects outside this
  # process, which makes it the one thing somebody else usually wants to know
  # about. A hook fires `before` the call goes out, `after` it comes back, or
  # both.
  #
  # `actions:` is a list, because one event is usually two calls to two
  # different people: the file goes to the API about to run it, the line goes to
  # the audit sink. They go out in the order written, each with its own address,
  # credential and body, and each lands in the trace as its own record.
  #
  # `- http:` is the only kind so far; the kind is the key it is written under
  # so the next one does not have to break this file.
  #
  # What an action sends is what it says it sends, and nothing otherwise: with
  # neither `json:` nor `multipart:`, the request carries **no body at all**.
  # That is deliberate — a payload nobody wrote is a request the endpoint never
  # agreed to read.
  #
  # `auth:` and `headers:` work exactly as they do on a server above, with two
  # differences that are the hook's own: the credential is resolved against the
  # *action's* URL, so `allowed_hosts` means what it says, and it is resolved
  # only when the hook actually fires.
  #
  # - name: files
  #   url: https://mcp.internal/mcp
  #   hooks:
  #     # An audit trail. `json:` is a document, not a string: written as YAML,
  #     # sent as JSON, every string in it a template. A string that is one
  #     # `{{ … }}` and nothing else keeps the type of what it names — so
  #     # `arguments` below is the arguments *object*, not a quoted rendering of
  #     # one — while text around the expression makes it a string again.
  #     #
  #     # Undefined is an error, like everywhere else here, and every template is
  #     # compiled when this file loads.
  #     #
  #     # `on_error: continue` because an audit sink being down is not a reason
  #     # to fail the run it was watching.
  #     - name: audit
  #       on:
  #         - before
  #         - after
  #       on_error: continue
  #       actions:
  #         - http:
  #             url: https://audit.internal/tool-calls
  #             auth: keycloak-workload
  #             json:
  #               phase: '{{ phase }}'
  #               ran: '{{ tool }}'
  #               arguments: '{{ arguments }}'
  #               by: '{{ env.USER }}'
  #
  #     # The whole call in one line, for a sink that wants exactly that: phase,
  #     # server, tool, arguments, and on the way back the result. `env` and
  #     # `vars` are never in it — a hook shipping those because somebody wrote
  #     # `{{ call }}` would be a leak nobody asked for.
  #     - name: mirror
  #       on:
  #         - after
  #       on_error: continue
  #       actions:
  #         - http:
  #             url: https://audit.internal/calls
  #             json: '{{ call }}'
  #
  #     # A policy gate. `on_error: fail` — the default — means anything outside
  #     # 2xx stops the call: the `tools/call` never goes out, and the model is
  #     # told why so it has a chance to recover.
  #     #
  #     # `tools:` narrows it to the calls worth asking about. Each entry is a
  #     # regex matched against the *whole* name, so `delete_file` means that
  #     # tool and `write_.*` is how you ask for the wider net. Empty is every
  #     # tool, and a pattern that is not a regex is caught when this file loads.
  #     - name: gate
  #       on:
  #         - before
  #       tools:
  #         - write_.*
  #         - delete_file
  #       actions:
  #         - http:
  #             url: https://policy.internal/decide
  #             headers:
  #               x-api-key: '{{ auth["keycloak-workload"] }}'
  #
  #     # An endpoint that wants the file itself. `multipart:` is one entry per
  #     # form field, each naming uploads of the run: the request becomes a
  #     # `multipart/form-data` carrying exactly those, under exactly those field
  #     # names — which is what an API asking for `file` is actually asking for.
  #     #
  #     # Each entry names one upload, by `path`, `name` or `id`, or by handing
  #     # over the upload itself. A field can carry several — write a list, or an
  #     # expression producing one, like `'{{ uploads }}'` for all of them — and
  #     # they go out as several parts under the same name.
  #     #
  #     # A field naming a file the run is not carrying fails the hook, and so
  #     # does one that resolves to nothing at all. Sending a form with the part
  #     # missing is how an endpoint ends up explaining this file back to you, in
  #     # the shape of a 422.
  #     #
  #     # `json:` and `multipart:` are two bodies; declaring both is refused when
  #     # this file loads.
  #     - name: upload
  #       on:
  #         - before
  #       tools:
  #         - run_task
  #       actions:
  #         - http:
  #             url: https://intake.internal/jobs/{{ arguments.job_id }}/inputs
  #             auth: keycloak-user
  #             multipart:
  #               file: '{{ uploads[0].path }}'
  #
  #     # A hook addressed with what an earlier call answered. `vars` is filled
  #     # by the profile's `agent.capture:` — see captures.yaml — and is in scope
  #     # for `url:`, `headers:`, `json:` and `multipart:` alike.
  #     #
  #     # `url:` is a template only when it contains one, so every URL above is
  #     # still parsed and checked when this file loads. A variable nobody
  #     # captured fails the hook rather than rendering away to
  #     # `/sessions//tool-calls`, which is a different endpoint that may well
  #     # answer 200.
  #     #
  #     # `if:` is a MiniJinja expression asked once per firing: true and the
  #     # hook fires, false and it sits the call out. Without it, the URL below
  #     # fails every call made before a session exists; with it, the hook sits
  #     # those out and starts firing once one does.
  #     #
  #     # It sees exactly what `url:`, `json:` and `headers:` see, so the whole
  #     # call is fair game — `{{ result.is_error == false }}` audits only what
  #     # worked, `{{ arguments.size > 1048576 }}` asks about the big ones,
  #     # `{{ env.STAGE == "prod" }}` keeps a hook off your laptop.
  #     #
  #     # Undefined is false here rather than an error — the one place in a hook
  #     # where it is, because a condition is *asking* whether something is
  #     # there. Truthiness is MiniJinja's, so a variable captured as `null` is
  #     # false too: write `is defined` when presence is the question you meant.
  #     #
  #     # Not firing is not failing: `on_error` does not apply, nothing is sent,
  #     # and the tool call is untouched. The skip is still recorded, quoting the
  #     # condition that came back false — a hook that quietly never ran and a
  #     # hook that was never declared must not look the same in a trace. A
  #     # condition that cannot be *evaluated* is a hook failure like any other.
  #     - name: session-audit
  #       on:
  #         - after
  #       if: '{{ vars.session is defined }}'
  #       actions:
  #         - http:
  #             url: https://audit.internal/sessions/{{ vars.session }}/tool-calls
  #             auth: keycloak-workload
  #             headers:
  #               x-session: '{{ vars.session }}'
  #             json:
  #               result: '{{ result }}'
  # ---------------------------------------------------------------------------
