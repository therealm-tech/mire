# The same model, decoded with a script instead of cascades.
#
# The motivating case is real: qwen3 emits its reasoning inside a
# `<think>…</think>` block at the front of the content. A JSONPath cascade can
# *select* the content, but it cannot rewrite it — no path strips a prefix, and
# no path computes anything. That is what a script is for, and it is the only
# thing it should be for: reach for a cascade first, every time.
#
# `think: false` stays on so this profile is usable — on a CPU-only Ollama the
# model produces well under one token per second, and a reasoning block takes
# minutes. Flip it to `true` and the strip below is what makes the answer
# readable; the behaviour is covered by a test either way.
---
name: qwen3-scripted
kind: chat
url: http://127.0.0.1:11434/api/chat
timeout_ms: 300000

request:
  template: |
    {
      "model": "qwen3:0.6b-q4_K_M",
      "messages": {{ messages | tojson }},
      "stream": false,
      "think": false,
      "options": {
        "num_predict": {{ params.max_tokens | default(128) }}
      }
    }

decode:
  # `raw`, `status` and `headers` are in scope. Return a map; anything you leave
  # out is simply absent from the decoded output.
  #
  # A script replaces the cascades entirely — declaring both is a load error, so
  # there is no precedence rule to remember.
  script: |
    let content = raw.message.content;

    // Everything up to and including `</think>` is the model thinking aloud.
    let close = content.index_of("</think>");
    let thought = close >= 0;
    if thought {
      // `trim()` mutates in place and returns nothing, so it cannot be chained.
      content = content.sub_string(close + 8);
      content.trim();
    }

    // Nanoseconds into tokens per second — arithmetic, which no path can do.
    // Convert before comparing: Rhai will not mix an integer and a float.
    let ns = raw.eval_duration.to_float();
    let speed = if ns > 0.0 {
      (raw.eval_count.to_float() * 100.0 * 1000000000.0 / ns).round() / 100.0
    } else {
      0.0
    };

    #{
      content: content,
      finish_reason: `${raw.done_reason} (${speed} tok/s${if thought { ", after thinking" } else { "" }})`,
      usage: #{
        prompt_tokens: raw.prompt_eval_count,
        completion_tokens: raw.eval_count,
      },
    }
