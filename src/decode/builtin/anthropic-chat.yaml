# Anthropic's Messages API.
#
# The answer is a *list of blocks*, not a string, and the first one is not
# necessarily the text: thinking is on by default on the current models, so
# `$.content[0].text` reads a block that has no `text` at all. The filter is what
# makes this work, and the several text blocks a cited answer produces are
# concatenated in the order they arrive.
#
# Streamed, only the `content_block_delta` frames carry text — `$.delta.text`
# misses on every other frame, which is the correct answer for them.
#
# The stop reason has a streamed spelling too. Whole, it is `$.stop_reason`; in a
# stream it arrives in the `message_delta` frame as `$.delta.stop_reason`, and
# the stream then closes on an empty `message_stop`. Both are listed, and the
# first cannot match a frame the second describes, so the cascade is right either
# way.
#
# Its vocabulary separates the two states an agent loop cares about: `tool_use`
# is a turn still asking for something, and everything listed below is a turn
# that has finished. `pause_turn` is deliberately absent — it is the one value
# that means *keep going*, a long-running turn the API cut in half and expects
# handed straight back.
---
name: anthropic-chat
kind: chat
decode:
  content:
    - "$.content[?(@.type == 'text')].text"
  delta:
    - $.delta.text
  tool_calls:
    - "$.content[?(@.type == 'tool_use')]"
  finish_reason:
    - $.stop_reason
    - $.delta.stop_reason
  terminal_reasons:
    - end_turn
    - max_tokens
    - stop_sequence
    - refusal
  usage:
    - $.usage
  error:
    - $.error
