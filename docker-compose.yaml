# A model endpoint and an identity provider you can actually point `mire` at.
#
#   docker compose up -d
#   export OIDC_CLIENT_SECRET=mire-dev-secret
#   export MODEL_TOKEN=anything
#   mire
#
# Nothing here is meant to leave a laptop: the credentials are constants, the
# gateway checks presence rather than signature, and Keycloak runs in dev mode
# with an in-memory database.
---
services:
  # The model runtime. Unauthenticated on purpose — `gateway` is what makes the
  # auth matrix demonstrable.
  ollama:
    image: ollama/ollama:0.32.6
    ports:
      - 127.0.0.1:11434:11434
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 5s
      timeout: 5s
      retries: 20

  # Pulls the fixtures once, then exits. Re-running `up` is a no-op.
  #
  # qwen3:0.6b is the smallest tag that still does tool calling, which the agent
  # mode needs; gemma3:270m is lighter (~292 MB) but cannot call tools.
  # nomic-embed-text is 274 MB, 768 dimensions, and runs on a CPU.
  # Benchmarks snapshot: August 2026 — worth revisiting, these move monthly.
  ollama-pull:
    image: ollama/ollama:0.32.6
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        ollama pull qwen3:0.6b-q4_K_M
        ollama pull nomic-embed-text:v1.5
        ollama list
    restart: "no"

  # A door in front of Ollama, so that "is this route actually protected?" has a
  # meaningful answer. It checks that an Authorization header is *present*, not
  # that it is valid — enough to make anonymous fail and both credentialled
  # modes succeed, and honest about being no more than that.
  gateway:
    image: nginx:1.29-alpine
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - 127.0.0.1:11435:8080
    volumes:
      - ./dev/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # An endpoint that does not read JSON, so `request.multipart:` has something
  # real to be pointed at. `speaches` is the current name of what used to be
  # `faster-whisper-server`; it serves the OpenAI-compatible
  # `/v1/audio/transcriptions`, which takes the audio as a form part and the
  # knobs as fields beside it.
  #
  # Published on 9000 because that is where `profiles/whisper.yaml` looks. The
  # container's own port is 8000 and stays that way.
  whisper:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    ports:
      - 127.0.0.1:9000:8000
    environment:
      # Nested settings take a double underscore, and the names are the ones
      # *this* tag reads: 0.9 renamed several of them, and a setting that has
      # been renamed is not a setting that errors — pydantic ignores the unknown
      # variable and you get the default with no warning at all. Both of these
      # were read back out of the config line the server logs on startup.
      #
      # CTranslate2 defaults to float32 on a CPU. `int8` is several times faster
      # for a loss you will not hear at this size, and there is no GPU to fall
      # back on: faster-whisper does CUDA or CPU, with no Metal, so a Mac runs
      # this on the CPU like everything else here.
      WHISPER__COMPUTE_TYPE: int8
      # Never unload. The default drops the model after five minutes idle and
      # the next call pays the load again — a latency number in the traffic
      # panel that says more about the cache than about the endpoint.
      WHISPER__TTL: "-1"
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8000/health
      interval: 5s
      timeout: 5s
      retries: 20

  # Fetches the model once, then exits — the same shape as `ollama-pull`, and
  # for the same reason. This tag has no preloading of its own, so left alone it
  # downloads on the first transcription: a first call that looks like an
  # endpoint hanging, which is the one failure mode this stack should not be
  # teaching.
  #
  # `faster-whisper-base` is ~145 MB and transcribes faster than real time on a
  # laptop CPU. `-tiny` is a third of that and noticeably worse; `-small` is
  # better and four times the download. Change it here and in
  # `profiles/whisper.yaml`, which names the model in the form it sends.
  whisper-pull:
    image: curlimages/curl:8.19.0
    depends_on:
      whisper:
        condition: service_healthy
    command:
      - --fail
      - --silent
      - --show-error
      - -X
      - POST
      - http://whisper:8000/v1/models/Systran/faster-whisper-base
    restart: "no"

  # The identity provider behind `kind: oidc`. Dev mode, in-memory, realm
  # imported at startup.
  # Something for agent mode to really call. Standard library only, so there is
  # nothing to install and nothing to pin beyond the base image.
  #
  # It also checks `mire` back: it validates that the mirrored request headers
  # agree with the body, the way the specification requires of a server, so a
  # client that gets `Mcp-Method` / `Mcp-Name` / `Mcp-Param-*` wrong is told.
  mcp:
    image: python:3.13-alpine
    command:
      - python
      - /srv/server.py
    ports:
      - 127.0.0.1:11436:11436
    volumes:
      - ./dev/mcp/server.py:/srv/server.py:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,json;
          d=json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/list','params':{}}).encode();
          r=urllib.request.Request('http://localhost:11436/mcp', data=d, headers={
          'content-type':'application/json','mcp-method':'tools/list',
          'mcp-protocol-version':'2026-07-28'});
          exit(0 if 'tools' in urllib.request.urlopen(r).read().decode() else 1)"
      interval: 5s
      timeout: 5s
      retries: 10

  # The same server on an older revision, so the negotiation has something to
  # negotiate *with*. Point a profile at both and watch `mire` settle on
  # `2026-07-28` for one and handshake its way to `2025-06-18` for the other.
  mcp-legacy:
    image: python:3.13-alpine
    command:
      - python
      - /srv/server.py
    environment:
      MCP_REVISION: 2025-06-18
      PORT: "11437"
    ports:
      - 127.0.0.1:11437:11437
    volumes:
      - ./dev/mcp/server.py:/srv/server.py:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,json;
          d=json.dumps({'jsonrpc':'2.0','id':1,'method':'initialize','params':
          {'protocolVersion':'2025-06-18','capabilities':{},
          'clientInfo':{'name':'healthcheck','version':'0'}}}).encode();
          r=urllib.request.Request('http://localhost:11437/mcp', data=d, headers={
          'content-type':'application/json'});
          exit(0 if 'protocolVersion' in urllib.request.urlopen(r).read().decode() else 1)"
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./dev/keycloak/realm-mire.json:/opt/keycloak/data/import/realm-mire.json:ro
    healthcheck:
      # The image ships neither curl nor wget, so use bash's own TCP support.
      # CRLF matters: the management endpoint answers 400 to bare newlines.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  ollama-models:
  whisper-models:
