# A door in front of Ollama.
#
# It answers 401 when there is no Authorization header and proxies through when
# there is one — whatever it contains. That is enough to make `mire`'s auth
# matrix meaningful (anonymous must fail, token and oidc must succeed) and it is
# deliberately no more than that: this checks presence, not signature.

map $http_authorization $missing_credential {
    ""      1;
    default 0;
}

server {
    listen 8080;

    location / {
        if ($missing_credential) {
            add_header content-type application/json always;
            return 401 '{"error":"missing bearer token"}';
        }

        proxy_pass http://ollama:11434;
        proxy_set_header Host $host;

        # A cold model can take a while to load on the first call.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
