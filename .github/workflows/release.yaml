name: release

on:
  push:
    tags:
      - "v*"

# One release per ref: a newer run supersedes the one still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: derive the version from the tag
        id: v
        # Strip the leading `v` so the value is valid SemVer for the image.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: check the manifest version matches the tag
        env:
          VERSION: ${{ steps.v.outputs.version }}
        # The tag drives the image tag and the artefact names, but `Cargo.toml`
        # is what ends up in `mire --version`. Let them drift and the released
        # binary lies about which release it is — so fail here, before anything
        # is published.
        run: |
          manifest="$(sed -n '/^\[package\]/,/^\[/{s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p;}' Cargo.toml)"
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::Cargo.toml version is $manifest but the tag says $VERSION — bump Cargo.toml or retag."
            exit 1
          fi
          echo "Cargo.toml version $manifest matches tag $GITHUB_REF_NAME"

  build:
    name: build
    needs: version
    permissions:
      contents: read
      packages: write
      # The reusable build workflow uploads Trivy SARIF to the Security tab; a
      # reusable workflow can never exceed the permissions its caller grants.
      security-events: write
    uses: ./.github/workflows/build.yaml
    with:
      push: true
      version: ${{ needs.version.outputs.version }}

  github-release:
    name: github-release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # `x86_64` and `aarch64`, each taken out of the image published for that
      # architecture — same bits, one build.
      - name: download the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: verify the checksums
        working-directory: dist
        # Cheap, and it catches an artefact that was truncated between the build
        # runner and here — which would otherwise be found by whoever downloads
        # the release.
        run: |
          set -euo pipefail
          ls -l
          sha256sum --check ./*.sha256

      - name: create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            ./dist/*
